server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: serve index.html for any unknown path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
