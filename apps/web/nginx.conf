server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. NOTE the nginx quirk: any add_header inside a
    # location DISCARDS inherited ones, so locations that add their own
    # Cache-Control must repeat this whole set (see below).
    # CSP allowances: wasm-unsafe-eval for sql.js; unsafe-inline styles for
    # chart libs; https: images for food/exercise photos (OFF, FatSecret,
    # jsDelivr); OFF in connect-src for browser-direct barcode lookups;
    # blob: workers for the local database layer.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://world.openfoodfacts.org; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The exercise catalog ships as a ~1 MB JSON asset; gzip cuts it (and the
    # JS bundles) to a fraction on the wire. html is compressed by default.
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # Same-origin API: the browser talks to /v1 here; nginx forwards to the api
    # service. The target comes from the API_PROXY_TARGET env var (substituted
    # at container start): compose sets http://api:3000, Railway sets the
    # private-network URL. Same-origin keeps cookies first-party and CORS moot.
    #
    # The target lives in an nginx variable ON PURPOSE: with a static
    # proxy_pass, nginx resolves the hostname once at boot and caches the IP
    # forever — after the api service redeploys (new address), every request
    # would hang. A variable forces re-resolution via the resolver below.
    # API_DNS_RESOLVER: 127.0.0.11 for Docker's embedded DNS (compose),
    # [fd12::10] for Railway's private-network DNS.
    resolver ${API_DNS_RESOLVER} valid=10s;

    location /v1/ {
        set $api_upstream ${API_PROXY_TARGET};
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA routing: serve index.html for any unknown path. HTML must never be
    # cached hard — it is the pointer to the hashed assets.
    # (Security headers repeated: add_header in a location drops inherited ones.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Assets are safe to cache forever: JS/CSS are content-hashed and the
    # sql.js wasm lives under a versioned directory.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
