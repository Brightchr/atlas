server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser talks to /v1 here; nginx forwards to the
    # api container over the compose network. No CORS, first-party cookies.
    location /v1/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA routing: serve index.html for any unknown path. HTML must never be
    # cached hard — it is the pointer to the hashed assets.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Assets are safe to cache forever: JS/CSS are content-hashed and the
    # sql.js wasm lives under a versioned directory.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
