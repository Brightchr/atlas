<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>Arcadia Atlas</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the default.
      document.documentElement.dataset.theme = (function (t) { var old = {volt:'aurora',circuit:'jade',fjord:'cobalt',ember:'onyx',glacier:'frost',prism:'orchid',mint:'frost',midnight:'onyx',carbon:'onyx','indigo-night':'aurora',tide:'jade',meadow:'paper',ion:'jade','old-growth':'jade',timberline:'paper'}; return old[t] || t || 'onyx'; })(localStorage.getItem('arcadia-theme'));

      // Browsers never fire requestAnimationFrame in hidden/background tabs, but
      // jeep-sqlite (our browser SQLite) renders via rAF and would stall forever.
      // Fall back to a timer while the tab is hidden so the database still opens.
      (function () {
        var nativeRaf = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = function (cb) {
          return document.hidden
            ? setTimeout(function () { cb(performance.now()); }, 32)
            : nativeRaf(cb);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
