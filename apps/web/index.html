<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#f4f5fb" />
    <title>Arcadia Atlas</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the default.
      document.documentElement.dataset.theme = localStorage.getItem('arcadia-theme') || 'aurora';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
