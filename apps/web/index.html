<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#f4f5fb" />
    <title>Arcadia Atlas</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the default.
      document.documentElement.dataset.theme = ({aurora:'glacier',mint:'meadow',midnight:'indigo-night',carbon:'tide'})[localStorage.getItem('arcadia-theme')] || localStorage.getItem('arcadia-theme') || 'indigo-night';

      // Browsers never fire requestAnimationFrame in hidden/background tabs, but
      // jeep-sqlite (our browser SQLite) renders via rAF and would stall forever.
      // Fall back to a timer while the tab is hidden so the database still opens.
      (function () {
        var nativeRaf = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = function (cb) {
          return document.hidden
            ? setTimeout(function () { cb(performance.now()); }, 32)
            : nativeRaf(cb);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
