services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # URL the browser (not the container) uses to reach wger — local stack port.
        VITE_WGER_URL: http://localhost:8001
    ports:
      - '8080:80'
    depends_on:
      - api
